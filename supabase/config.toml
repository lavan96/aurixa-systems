# Supabase project config for the Aurixa Systems storefront backend.
project_id = "moeyytuduycrvvncdtme"

[functions.catalog-sync]
verify_jwt = true

[functions.storefront-catalog]
verify_jwt = false

[functions.storefront-setup]
verify_jwt = false

[functions.storefront-wallet]
verify_jwt = false

# Stage 2 readiness questionnaire. Public entry point: authorisation is carried
# by the questionnaire token, not a Supabase JWT. The admin-only `issue` action
# is guarded by the READINESS_ADMIN_SECRET header check inside the function.
[functions.readiness-questionnaire]
verify_jwt = false

# The feedback form and the plan-change notice are reached from a marketing
# page with no login, so authorisation is possession of the `?h=` handoff or
# `?uid=` in the URL — never a Supabase JWT. The browser sends no Authorization
# header at all (see `apiGet` in src/lib/billing.ts), so leaving these to the
# `verify_jwt = true` default 401s every request before the function is reached.
# That is exactly what happened: both were absent here AND undeployed, and the
# feedback page could never load its form.
[functions.storefront-feedback]
verify_jwt = false

[functions.storefront-plan-change]
verify_jwt = false

# Documentation for the Command Center, gated by entitlement. Reached from a
# marketing page with no login and, for customers, from a dashboard link
# carrying a `?h=` handoff — so authorisation is possession of that token, not a
# Supabase JWT. The browser sends no Authorization header, so the default
# `verify_jwt = true` would 401 every request before the function runs.
[functions.storefront-docs]
verify_jwt = false
